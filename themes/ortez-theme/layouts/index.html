{{ define "main" }}
<section class="hero-full">
    <div class="container">
        <h1>{{ .Site.Title }}</h1>
        <p class="subtitle">Виготовлення протезно-ортопедичної продукції за індивідуальним замовленням</p>
        <a href="tel:{{ .Site.Params.phone | replaceRE ` ` `` }}" class="btn btn-primary">Запис на консультацію</a>
    </div>
</section>

<section class="section">
    <div class="container">
        <h2 class="text-center mb-5">Послуги</h2>
        <div class="services-carousel">
            <div class="carousel-item"><a href="{{ `/ortezy/systemy-orteziv-na-verhni-kinczivky/` | relURL }}"><img
                        src="{{ `/images/ortez_verhnij_bezsharnirnyj-1024x706.png` | relURL }}">
                    <h4 class="mt-2">Ортези верхні</h4>
                </a></div>
            <div class="carousel-item"><a href="{{ `/ortezy/systemy-orteziv-na-verhni-kinczivky/` | relURL }}"><img
                        src="{{ `/images/ortez_verhni_sharnirnyj-1024x706.png` | relURL }}">
                    <h4 class="mt-2">Ортези шарнірні</h4>
                </a></div>
            <div class="carousel-item"><a href="{{ `/protezy/systemy-proteziv-na-nyzhni-kinczivky/` | relURL }}"><img
                        src="{{ `/images/protez_nyzhni-1024x706.png` | relURL }}">
                    <h4 class="mt-2">Протези нижні</h4>
                </a></div>
            <div class="carousel-item"><a href="{{ `/ortezy/systemy-orteziv-na-nyzhni-kinczivky/` | relURL }}"><img
                        src="{{ `/images/ortez_nyzhni_bezsharnirnyj-1024x706.png` | relURL }}">
                    <h4 class="mt-2">Ортези нижні</h4>
                </a></div>
        </div>
    </div>
</section>

                style="flex: 0 1 180px; display: flex; justify-content: center; align-items: center;"><img
                    src="{{ `/images/1280px-Otto_Bock_logo.svg.png` | relURL }}"
                    style="max-height: 80px; max-width: 100%; object-fit: contain;"></div>
            <div class="partner-item"
                style="flex: 0 1 180px; display: flex; justify-content: center; align-items: center;"><img
                    src="{{ `/images/minsocpol-300x300.png` | relURL }}"
                    style="max-height: 80px; max-width: 100%; object-fit: contain;"></div>
            <div class="partner-item"
                style="flex: 0 1 180px; display: flex; justify-content: center; align-items: center;"><img
                    src="{{ `/images/ntdmq_bmeia1345435-300x252.png` | relURL }}"
                    style="max-height: 80px; max-width: 100%; object-fit: contain;"></div>
            <div class="partner-item"
                style="flex: 0 1 180px; display: flex; justify-content: center; align-items: center;"><img
                    src="{{ `/images/okm5345345-300x300.png` | relURL }}"
                    style="max-height: 80px; max-width: 100%; object-fit: contain;"></div>
            <div class="partner-item"
                style="flex: 0 1 180px; display: flex; justify-content: center; align-items: center;"><img
                    src="{{ `/images/logo34534-300x300.png` | relURL }}"
                    style="max-height: 80px; max-width: 100%; object-fit: contain;"></div>
        </div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script>
$(document).ready(function(){
    // Mobile menu toggle
    $('.mobile-menu-toggle').click(function(){
        $(this).toggleClass('active');
        $('.main-nav').toggleClass('active');
        $('body').toggleClass('menu-open');
    });

    // Close menu on link click
    $('.nav-link').click(function(){
        if($(window).width() <= 768) {
            $('.mobile-menu-toggle').removeClass('active');
            $('.main-nav').removeClass('active');
            $('body').removeClass('menu-open');
        }
    });

    // Carousels
    $('.services-carousel').slick({
        slidesToShow: 3, slidesToScroll: 1, autoplay: true, dots: true, arrows: true,
        responsive: [{breakpoint: 768, settings: {slidesToShow: 1, arrows: false, centerMode: true, centerPadding: '30px'}}]
    });
    $('.partners-carousel').slick({
        slidesToShow: 4, slidesToScroll: 1, autoplay: true, autoplaySpeed: 2000, arrows: false,
        responsive: [{breakpoint: 768, settings: {slidesToShow: 2}}]
    });
});
</script>

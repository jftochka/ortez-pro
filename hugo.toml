canonifyURLs = true
baseURL = 'https://ortez.com.ua/'
languageCode = 'uk-UA'
title = 'Ортез-Про'
theme = 'ortez-theme'

defaultContentLanguage = 'uk'
enableRobotsTXT = true

# Disable empty taxonomy pages so they don't appear in sitemap
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Required for raw HTML in content files (pro-nas.md, yak-otrymaty.md).
      # Mitigated by: GitHub OAuth on CMS, editorial workflow (PR review), Git history.
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  filename = "sitemap.xml"

# Security: restrict Hugo's OS access
[security]
  [security.exec]
    allow = ['^go$', '^npx$', '^postcss$']
    osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM|HOME|USERPROFILE)$']
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']
  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['.*']
